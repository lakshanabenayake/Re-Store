version: '3.8'

services:
  # SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: restore-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD:-YourStrong@Passw0rd}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - restore-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD:-YourStrong@Passw0rd}" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ASP.NET Core API
  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: restore-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_SERVER=db
      - DB_PORT=1433
      - DB_NAME=${DB_NAME:-RestoreDb}
      - DB_USER=sa
      - DB_PASSWORD=${DB_PASSWORD:-YourStrong@Passw0rd}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - restore-network
    restart: unless-stopped

  # Next.js Client
  client:
    build:
      context: ./clientv2
      dockerfile: Dockerfile
    container_name: restore-client
    environment:
      - NEXT_PUBLIC_API_URL=http://api:5000
    ports:
      - "80:3000"
    depends_on:
      - api
    networks:
      - restore-network
    restart: unless-stopped

volumes:
  sqlserver-data:
    driver: local

networks:
  restore-network:
    driver: bridge
